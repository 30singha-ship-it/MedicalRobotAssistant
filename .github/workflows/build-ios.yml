# ============================================================================
#  build-ios.yml — GitHub Actions workflow (v2 — fixes "future project format")
#  Path in repo: .github/workflows/build-ios.yml  (replace the old file)
# ============================================================================
#  Fix applied: GitHub's macOS runners ship several Xcode versions side by
#  side, and the default one selected can be older than what XcodeGen's
#  generated project format requires ("cannot be opened because it is in a
#  future Xcode project file format"). The new "Select latest Xcode" step
#  switches xcode-select to the newest installed Xcode before building, so
#  the project format is always compatible.
# ============================================================================
name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show selected Xcode version (sanity check)
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build unsigned .xcarchive
        run: |
          xcodebuild \
            -project MedicalRobotAssistant.xcodeproj \
            -scheme MedicalRobotAssistant \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MedicalRobotAssistant.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package .ipa (Payload/*.app zipped)
        run: |
          mkdir -p build/Payload
          cp -r build/MedicalRobotAssistant.xcarchive/Products/Applications/MedicalRobotAssistant.app \
                build/Payload/
          cd build && zip -r ../MedicalRobotAssistant.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalRobotAssistant-ipa
          path: MedicalRobotAssistant.ipa
